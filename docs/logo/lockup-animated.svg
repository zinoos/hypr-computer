<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1265 304"><title>hypr-computer</title><style>
.t,.live,.word{transform-box:fill-box;transform-origin:center}
.t{animation:in .5s cubic-bezier(.2,.8,.2,1.2) both}.t1{animation-delay:.12s}.t2{animation-delay:.24s}
.live{transform-origin:0 0;animation:move 1s .45s cubic-bezier(.3,1.3,.5,1) both}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:click 2.6s 1.5s ease-out infinite}
.word{animation:word .7s .35s ease-out both}
@keyframes in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes move{0%{opacity:0;transform:translate(40px,70px)}40%{opacity:1}80%{transform:none}88%{transform:scale(.82)}100%{opacity:1;transform:none}}
@keyframes click{0%{opacity:.7;transform:scale(.3)}70%,100%{opacity:0;transform:scale(1.6)}}
@keyframes word{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.t,.live,.word,.ring{animation:none}.ring{opacity:0}}
